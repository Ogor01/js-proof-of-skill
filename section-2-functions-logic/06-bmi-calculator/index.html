<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculator</h1>

        <div class="tabs">
            <button class="tab active" data-unit="metric">Metric (kg/cm)</button>
            <button class="tab" data-unit="imperial">Imperial (lbs/in)</button>
        </div>

        <input type="number" id="weightInput" placeholder="Weight (kg)" />
        <input type="number" id="heightInput" placeholder="Height (cm)" />

        <button id="calculateButton">Calculate BMI</button>
        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
