<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interest Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Interest Calculator</h1>

        <div class="tabs">
            <button class="tab active" id="simpleTab">Simple Interest</button>
            <button class="tab" id="compoundTab">Compound Interest</button>
        </div>

        <input type="number" id="principalInput" placeholder="Principal amount ($)" />
        <input type="number" id="rateInput" placeholder="Annual interest rate (%)" />
        <input type="number" id="timeInput" placeholder="Time (years)" />

        <button id="calculateButton">Calculate</button>
        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
