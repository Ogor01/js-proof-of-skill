<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Max and Min Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Max & Min Finder</h1>
        <p>Enter 5 numbers to find the highest and lowest</p>

        <input type="number" placeholder="Number 1" class="numInput" />
        <input type="number" placeholder="Number 2" class="numInput" />
        <input type="number" placeholder="Number 3" class="numInput" />
        <input type="number" placeholder="Number 4" class="numInput" />
        <input type="number" placeholder="Number 5" class="numInput" />

        <button id="findButton">Find Max & Min</button>

        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
