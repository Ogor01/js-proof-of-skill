<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Numbers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Number Sorter</h1>
        <p>Enter numbers separated by commas</p>

        <input type="text" id="numbersInput" placeholder="e.g. 5, 2, 8, 1, 9" />

        <div class="buttons">
            <button id="ascButton">Sort Ascending ↑</button>
            <button id="descButton">Sort Descending ↓</button>
        </div>

        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
