<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merge Two Arrays</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Merge Two Arrays</h1>

        <input type="text" id="array1Input" placeholder="Array 1 e.g. 1, 2, 3" />
        <input type="text" id="array2Input" placeholder="Array 2 e.g. 4, 5, 6" />

        <div class="buttons">
            <button id="mergeButton">Merge</button>
            <button id="mergeUniqueButton">Merge Unique</button>
        </div>

        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
