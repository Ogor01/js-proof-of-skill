<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Count Value Appearances</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Value Counter</h1>
        <p>Count how many times a value appears in a list</p>

        <input type="text" id="valuesInput" placeholder="e.g. apple, banana, apple, orange" />
        <input type="text" id="searchInput" placeholder="Value to search for" />
        <button id="countButton">Count</button>

        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
