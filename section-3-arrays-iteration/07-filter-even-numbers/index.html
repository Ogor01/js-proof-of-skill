<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Even Numbers</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Even Number Filter</h1>
        <p>Enter numbers separated by commas</p>

        <input type="text" id="numbersInput" placeholder="e.g. 1, 2, 3, 4, 5, 6" />

        <div class="buttons">
            <button id="evenButton">Filter Even</button>
            <button id="oddButton">Filter Odd</button>
        </div>

        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
