<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Average Score Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Average Score Calculator</h1>
        <p>Enter scores separated by commas</p>

        <input type="text" id="scoresInput" placeholder="e.g. 85, 90, 78, 92, 88" />
        <button id="calculateButton">Calculate Average</button>

        <div id="result"></div>
    </div>
    <script src="index.js"></script>
</body>
</html>
